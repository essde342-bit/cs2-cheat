name: Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v4

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Setup Ninja
      uses: ashutoshvarma/setup-ninja@master
      with:
        version: 1.11.1

    - name: Cache ImGui
      uses: actions/cache@v4
      with:
        path: build/_deps
        key: ${{ runner.os }}-imgui-v1904
        restore-keys: ${{ runner.os }}-imgui-

    - name: Configure
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl

    - name: Build
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        cmake --build build --config Release -j 4

    - name: Find exe
      shell: pwsh
      run: |
        $exe = Get-ChildItem -Path build -Recurse -Filter "CS2ESP.exe" | Select-Object -First 1
        if (-not $exe) { Write-Error "Build failed - no exe"; exit 1 }
        Copy-Item $exe.FullName "CS2ESP.exe"
        Write-Host "OK: $($exe.FullName)"

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: CS2ESP
        path: CS2ESP.exe
        retention-days: 90

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
    - uses: actions/download-artifact@v4
      with:
        name: CS2ESP

    - uses: softprops/action-gh-release@v2
      with:
        files: CS2ESP.exe
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
